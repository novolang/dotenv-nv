[package]
name        = "dotenv-nv"
version     = "0.1.0"
description = "The `.env` grammar and the file that carries it: three value forms with three different escape rules, `${VAR}` interpolation with defaults, the `export` prefix, multiline values, a document that keeps its comments so a rewrite is a one-line edit, and a loader whose override policy against the real environment is a declared argument.  One call converts a file into config-core-nv's layer."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `host`.  Three of the four modules declare no effects: `dotenvparse`
# is the grammar, `dotenvwrite` the comment-preserving writer and
# `dotenvconf` the conversion into config-core-nv's tree.  `dotenvload`
# declares `[fs]` for the file and `[io]` in the functions that read the
# process environment, which is what `std.env` declares (SPEC section
# 5.1 has no separate label for the environment).
layer       = "host"

category    = "data"

tags        = ["dotenv", "env", "configuration", "environment", "parser"]
repository  = "https://github.com/novolang/dotenv-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A .env file, and what it actually means"

[dependencies]
# `ConfigValue`, `ConfigLayer` and `EnvKeyRule`: the tree a `.env` file
# becomes, so that it can be stacked beside a TOML file and the process
# environment.  `dotenvconf` hands config-core-nv's `EnvKeyRule` the
# file's pairs and adds nothing of its own.  config-core-nv is `core`, so
# the dependency is no wider than this package.
config-core-nv = "^0.1.0"
